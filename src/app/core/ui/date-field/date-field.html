<p-datepicker
  [dateFormat]="dateFormat()"
  [view]="view()"
  [selectionMode]="multiple() ? 'multiple' : 'single'"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [disabledDays]="blockedWeekdays()"
  [disabledDates]="blockedDates()"
  [placeholder]="placeholder() || undefined"
  [inputId]="inputId() || undefined"
  [disabled]="pickerDisabled()"
  [invalid]="invalid()"
  [required]="required()"
  [showIcon]="true"
  [fluid]="true"
  appendTo="body"
  panelStyleClass="tahfiz-datepicker-panel"
  (onBlur)="markTouched()"
/>
