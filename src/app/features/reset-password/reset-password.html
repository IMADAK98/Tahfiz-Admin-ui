<div class="login-page">
  <div class="login-wrap">
    <a class="brand-row" routerLink="/">
      <span class="brand-mark" aria-hidden="true">ت</span>
      تحفيظ
    </a>

    <div class="login-card">
      <h1>تعيين كلمة مرور جديدة</h1>
      <p class="login-sub">أدخل كلمة المرور الجديدة لحسابك</p>

      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <form class="login-form" (ngSubmit)="onSubmit($event)" aria-label="نموذج تعيين كلمة مرور جديدة">
        <div class="input-group login-field">
          <label for="new-password">كلمة المرور الجديدة</label>
          <p-password
            inputId="new-password"
            name="newPassword"
            [(ngModel)]="form.newPassword"
            placeholder="••••••••"
            [feedback]="true"
            [toggleMask]="true"
            autocomplete="new-password"
            required
            fluid
            [disabled]="submitting() || !token()"
          />
        </div>

        <div class="input-group login-field">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <p-password
            inputId="confirm-password"
            name="confirmPassword"
            [(ngModel)]="form.confirmPassword"
            placeholder="••••••••"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="new-password"
            required
            fluid
            [disabled]="submitting() || !token()"
          />
        </div>

        <p-button
          [type]="'submit'"
          [label]="submitting() ? 'جاري الحفظ…' : 'حفظ كلمة المرور'"
          styleClass="w-full"
          [loading]="submitting()"
          [disabled]="submitting() || !token()"
          (onClick)="onSubmit($event)"
        />
      </form>

      <p class="login-footer-links" style="margin-top: 1.25rem">
        <a routerLink="/login">العودة لتسجيل الدخول</a>
      </p>
    </div>
  </div>
</div>
