@if (visible()) {
  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <div
      class="modal modal-lg"
      role="dialog"
      aria-modal="true"
      aria-labelledby="plan-item-title"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h2 id="plan-item-title">تعديل العنصر</h2>
        <button type="button" class="modal-close" aria-label="إغلاق" (click)="close()">×</button>
      </div>

      <form [formGroup]="form" class="modal-body plan-item-form" (submit)="onSubmit($event)">
        @if (errorMessage(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }

        <p class="plan-item-context">خطة: <strong>{{ planName() }}</strong></p>

        <div class="plan-item-form-grid">
          <div class="input-group">
            <label for="edit-item-type">النوع</label>
            <p-select
              inputId="edit-item-type"
              [options]="itemTypeOptions"
              optionLabel="label"
              optionValue="value"
              formControlName="type"
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('type')" errorId="edit-item-type-error" />
          </div>

          <fieldset class="dir-fieldset brand-dir">
            <legend>الاتجاه</legend>
            @for (option of directionOptions; track option.value) {
              <label class="dir-opt">
                <input type="radio" [value]="option.value" formControlName="direction" />
                {{ option.label }}
              </label>
            }
          </fieldset>
        </div>
        <app-field-error [message]="fieldError('direction')" errorId="edit-item-direction-error" />

        <div class="plan-item-range-grid">
          <div class="input-group">
            <label for="edit-from-surah">من سورة</label>
            <p-select
              inputId="edit-from-surah"
              [options]="surahOptions()"
              optionLabel="label"
              optionValue="number"
              formControlName="fromSurah"
              (onChange)="onFromSurahChange($event.value)"
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error
              [message]="fieldError('fromSurahNumber', 'fromSurah')"
              errorId="edit-from-surah-error"
            />
          </div>
          <div class="input-group">
            <label for="edit-from-ayah">من آية</label>
            <p-select
              inputId="edit-from-ayah"
              [options]="ayahsBySurah()[model().fromSurah] ?? []"
              formControlName="fromAyah"
              [disabled]="!(ayahsBySurah()[model().fromSurah]?.length)"
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('fromAyah')" errorId="edit-from-ayah-error" />
          </div>
          <div class="input-group">
            <label for="edit-to-surah">إلى سورة <span class="hint-inline">(عرض فقط)</span></label>
            <p-select
              inputId="edit-to-surah"
              [options]="surahOptions()"
              optionLabel="label"
              optionValue="number"
              formControlName="toSurah"
              placeholder="—"
              [fluid]="true"
              appendTo="body"
            />
          </div>
          <div class="input-group">
            <label for="edit-to-ayah">إلى آية <span class="hint-inline">(عرض فقط)</span></label>
            <input pInputText class="input" fluid id="edit-to-ayah" type="text" [value]="model().toAyah ?? '—'" readonly />
          </div>
        </div>

        <div class="plan-item-amount-grid">
          <div class="input-group">
            <label for="edit-amount-type">نوع المقدار</label>
            <p-select
              inputId="edit-amount-type"
              [options]="amountTypeOptions"
              optionLabel="label"
              optionValue="value"
              formControlName="amountType"
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('amountType')" errorId="edit-amount-type-error" />
          </div>
          <div class="input-group">
            <label for="edit-amount-value">القيمة</label>
            <input
              pInputText class="input" fluid
              id="edit-amount-value"
              type="number"
              min="1"
              formControlName="amountValue"
            />
            <app-field-error [message]="fieldError('amountValue')" errorId="edit-amount-value-error" />
          </div>
        </div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="onSubmit($event)">
          {{ submitting() ? 'جاري الحفظ…' : 'حفظ' }}
        </button>
        <button type="button" class="btn btn-secondary" [disabled]="submitting()" (click)="close()">إلغاء</button>
      </div>
    </div>
  </div>
}
