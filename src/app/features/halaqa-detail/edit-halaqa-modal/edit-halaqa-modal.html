@if (visible()) {
  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <div
      class="modal modal-lg"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-halaqa-title"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h2 id="edit-halaqa-title">تعديل الحلقة</h2>
        <button type="button" class="modal-close" aria-label="إغلاق" (click)="close()">×</button>
      </div>

      <form [formGroup]="form" class="modal-body" (submit)="onSubmit($event)">
        @if (errorMessage(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }

        <div class="form-grid-2">
          <div class="input-group">
            <label for="edit-category">الفئة</label>
            <p-select
              inputId="edit-category"
              name="category"
              [options]="categoryOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="اختر الفئة"
              formControlName="category"
              required
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('category')" errorId="edit-category-error" />
          </div>
          <div class="input-group">
            <label for="edit-period">الفترة</label>
            <p-select
              inputId="edit-period"
              name="period"
              [options]="periodOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="اختر الفترة"
              formControlName="period"
              required
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('periods')" errorId="edit-period-error" />
          </div>
        </div>

        <div class="form-grid-2">
          <div class="input-group">
            <label for="edit-status">الحالة <span class="hint-inline">(عرض فقط)</span></label>
            <div class="field-readonly" id="edit-status">
              <span
                class="badge"
                [class.badge-success]="model().isActive"
                [class.badge-neutral]="!model().isActive"
              >
                {{ model().isActive ? 'نشطة' : 'متوقفة' }}
              </span>
            </div>
          </div>
          <div class="input-group">
            <label for="edit-teacher">المعلّم</label>
            <p-select
              inputId="edit-teacher"
              name="teacherId"
              [options]="teachers()"
              optionLabel="name"
              optionValue="id"
              placeholder="اختر المعلّم"
              formControlName="teacherId"
              required
              [disabled]="pickersLoading()"
              [fluid]="true"
              appendTo="body"
            />
            <app-field-error [message]="fieldError('teacherId')" errorId="edit-teacher-error" />
          </div>
        </div>

        <div class="input-group">
          <label for="edit-student-limit">عدد الطلاب</label>
          <input
            class="input"
            id="edit-student-limit"
            type="number"
            min="1"
            formControlName="studentLimit"
            required
          />
          <app-field-error [message]="fieldError('studentLimit')" errorId="edit-student-limit-error" />
        </div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="onSubmit($event)">
          {{ submitting() ? 'جاري الحفظ…' : 'حفظ' }}
        </button>
        <button type="button" class="btn btn-secondary" [disabled]="submitting()" (click)="close()">
          إلغاء
        </button>
      </div>
    </div>
  </div>
}
