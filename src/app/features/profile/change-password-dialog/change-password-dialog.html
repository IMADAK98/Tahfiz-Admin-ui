@if (visible()) {
  <div class="modal-backdrop profile-modal" role="presentation" (click)="onBackdropClick($event)">
    <div class="modal profile-pw" role="dialog" aria-modal="true" aria-labelledby="pw-title" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 id="pw-title">تغيير كلمة المرور</h2>
        <button type="button" class="modal-close" aria-label="إغلاق" (click)="close()">×</button>
      </div>
      <form class="modal-body" id="formPassword" [formGroup]="form" novalidate (submit)="onSubmit($event)">
        @if (errorMessage(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }
        <div class="input-group">
          <label for="pw-current">كلمة المرور الحالية <span class="req">*</span></label>
          <input
            pInputText
            class="input"
            fluid
            id="pw-current"
            type="password"
            autocomplete="current-password"
            formControlName="currentPassword"
          />
          <app-field-error [message]="fieldError('currentPassword')" errorId="pw-current-error" />
        </div>
        <div class="input-group">
          <label for="pw-new">كلمة المرور الجديدة <span class="req">*</span></label>
          <input
            pInputText
            class="input"
            fluid
            id="pw-new"
            type="password"
            autocomplete="new-password"
            [attr.minlength]="minLength"
            formControlName="newPassword"
          />
          <p class="hint">ثمانية أحرف على الأقل</p>
          <app-field-error [message]="fieldError('newPassword')" errorId="pw-new-error" />
        </div>
        <div class="input-group">
          <label for="pw-confirm">تأكيد كلمة المرور الجديدة <span class="req">*</span></label>
          <input
            pInputText
            class="input"
            fluid
            id="pw-confirm"
            type="password"
            autocomplete="new-password"
            [attr.minlength]="minLength"
            formControlName="confirmPassword"
          />
          <app-field-error [message]="fieldError('confirmPassword')" errorId="pw-confirm-error" />
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" [disabled]="submitting()" (click)="close()">إلغاء</button>
        <button type="submit" class="btn btn-primary" form="formPassword" [disabled]="submitting()">
          {{ submitting() ? 'جاري الحفظ…' : 'حفظ' }}
        </button>
      </div>
    </div>
  </div>
}
