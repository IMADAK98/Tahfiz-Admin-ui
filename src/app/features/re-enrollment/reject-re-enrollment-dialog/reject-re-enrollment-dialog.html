@if (visible()) {
  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reject-re-title"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h2 id="reject-re-title">{{ 'reEnrollment.reject.title' | translate }}</h2>
        <button type="button" class="modal-close" aria-label="إغلاق" (click)="close()" [disabled]="submitting()">
          ×
        </button>
      </div>

      <form class="modal-body" (ngSubmit)="onSubmit($event)">
        <p style="margin: 0; font-size: 0.875rem; color: var(--color-muted)">
          {{ 'reEnrollment.reject.requestLabel' | translate }}
          <strong>{{ studentName() }}</strong>
        </p>

        @if (errorMessage()) {
          <p class="form-error" role="alert">{{ errorMessage() }}</p>
        }

        <div class="input-group">
          <label for="reject-reason">{{ 'reEnrollment.reject.reasonLabel' | translate }}</label>
          <textarea
            class="input"
            id="reject-reason"
            name="rejectionReason"
            rows="4"
            required
            [(ngModel)]="form.rejectionReason"
            [disabled]="submitting()"
            [placeholder]="'reEnrollment.reject.reasonPlaceholder' | translate"
          ></textarea>
          <span class="hint">{{ 'reEnrollment.reject.reasonHint' | translate }}</span>
        </div>

        <div class="modal-footer" style="padding: 0; border: 0; background: transparent">
          <button type="submit" class="btn btn-danger" [disabled]="!canSubmit() || submitting()">
            {{
              submitting() ?
                ('reEnrollment.reject.submitting' | translate)
              : ('reEnrollment.reject.submit' | translate)
            }}
          </button>
          <button type="button" class="btn btn-ghost" (click)="close()" [disabled]="submitting()">
            {{ 'reEnrollment.reject.cancel' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
